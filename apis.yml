name: Nuevo Método
description: >-
  Nuevo Método (NUME) is an international digital-health and corporate-wellness
  platform, headquartered in Mexico City and operating across 17 countries in
  Latin America and Europe. It helps insurers and enterprises deliver
  personalized wellbeing benefits to employees, customers, and their families
  across three pillars: mental health (psychology sessions, mindfulness,
  meditation, sleep tracking), physical health (24/7 virtual medical
  consultations, fertility guidance, menstrual-cycle tracking, health
  workshops), and lifestyle (personal-finance courses, financial advisory, and
  inspirational talks). The company runs a fully remote workforce and reports
  measurable client outcomes such as improved sleep, productivity, and employee
  retention. Founded and led by Dr. Ingrid Briggiler (CEO). No public API or
  developer portal is currently published; this profile captures the company's
  identity and probed domain-security posture.
